<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Desempenho de Anúncios - Thaís Oliveira</title>
<style>
  body {
    background: #120e10;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    padding: 24px 16px;
    display: flex;
    justify-content: center;
  }
  .card-container {
    background: #1a1416;
    border-radius: 16px;
    padding: 24px;
    width: 100%;
    max-width: 480px;
  }
  .header { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .avatar {
    width: 52px; height: 52px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg,#d4537e,#e08a4f);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 20px; font-weight: 500; object-fit: cover;
  }
  .title { color: #f2f2f0; font-size: 19px; font-weight: 500; margin: 0; }
  .subtitle { color: #c98aa3; font-size: 13px; margin: 2px 0 0; }
  .updated { color: #6b5a5f; font-size: 11px; margin-bottom: 16px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab {
    border: none; border-radius: 8px; padding: 6px 14px; font-size: 13px;
    cursor: pointer; background: #2a2226; color: #c98aa3;
  }
  .tab.active { background: #d4537e; color: #ffffff; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  .metric-card { background: #2a2226; border-radius: 10px; padding: 14px; }
  .metric-label { color: #c98aa3; font-size: 12px; margin-bottom: 6px; }
  .metric-value { color: #f2f2f0; font-size: 20px; font-weight: 500; }
  .chart-card { background: #2a2226; border-radius: 10px; padding: 16px; }
  .chart-label { color: #c98aa3; font-size: 12px; margin-bottom: 10px; }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 80px; }
  .bar { flex: 1; border-radius: 4px 4px 0 0; background: #8a3f5c; min-height: 3px; }
  .bar.recent { background: #d4537e; }
  .loading { color: #c98aa3; text-align: center; padding: 40px 0; }
  .error { color: #e08080; text-align: center; padding: 20px 0; font-size: 13px; }

  @media (max-width: 520px) {
    body { padding: 12px 8px; }
    .card-container { padding: 16px; border-radius: 12px; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .title { font-size: 16px; }
    .metric-value { font-size: 17px; }
    .tab { padding: 6px 10px; font-size: 12px; }
  }
</style>
</head>
<body>
  <div class="card-container">
    <div class="header">
      <div class="avatar" id="avatar">T</div>
      <div>
        <p class="title">Desempenho de Anúncios</p>
        <p class="subtitle">Thaís Oliveira</p>
      </div>
    </div>
    <div class="updated" id="updated"></div>
    <div id="tabs" class="tabs"></div>
    <div id="content">
      <div class="loading">Carregando dados...</div>
    </div>
  </div>

<script>
const labels = { todas: "Todas", leads: "Leads", vendas: "Vendas", engajamento: "Engajamento", trafego: "Tráfego" };
let dados = null;
let historico = [];
let seguidores = null;
let active = "todas";

function formatarMoeda(v) {
  return "R$ " + Number(v).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function formatarNumero(v) {
  return Number(v).toLocaleString("pt-BR");
}

function renderTabs() {
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = "";
  Object.keys(labels).forEach((key) => {
    const btn = document.createElement("button");
    btn.textContent = labels[key];
    btn.className = "tab" + (key === active ? " active" : "");
    btn.onclick = () => { active = key; renderTabs(); renderContent(); };
    tabsEl.appendChild(btn);
  });
}

function renderBars() {
  if (!historico.length) return "";
  const max = Math.max(...historico.map(h => h.spend), 1);
  const bars = historico.map((h, i) => {
    const pct = Math.max((h.spend / max) * 100, 2);
    const recent = i >= historico.length - 2 ? " recent" : "";
    return `<div class="bar${recent}" style="height:${pct}%"></div>`;
  }).join("");
  return `
    <div class="chart-card" style="margin-bottom:16px;">
      <div class="chart-label">Gasto por dia (última semana)</div>
      <div class="bars">${bars}</div>
    </div>`;
}

function renderContent() {
  const d = dados[active];
  const roasCard = d.roas !== null
    ? `<div class="metric-card"><div class="metric-label">ROAS</div><div class="metric-value">${d.roas.toFixed(1)}x</div></div>`
    : `<div class="metric-card" style="opacity:0.4"><div class="metric-label">ROAS</div><div class="metric-value">—</div></div>`;
  const seguidoresCard = seguidores !== null
    ? `<div class="metric-card"><div class="metric-label">Seguidores</div><div class="metric-value">${formatarNumero(seguidores)}</div></div>`
    : "";

  document.getElementById("content").innerHTML = `
    <div class="grid">
      <div class="metric-card"><div class="metric-label">Valor gasto</div><div class="metric-value">${formatarMoeda(d.gasto)}</div></div>
      <div class="metric-card"><div class="metric-label">Alcance</div><div class="metric-value">${formatarNumero(d.alcance)}</div></div>
      <div class="metric-card"><div class="metric-label">Cliques no link</div><div class="metric-value">${formatarNumero(d.cliques)}</div></div>
      <div class="metric-card"><div class="metric-label">${d.resultLabel}</div><div class="metric-value">${formatarNumero(d.resultado)}</div></div>
      <div class="metric-card"><div class="metric-label">${d.custoLabel}</div><div class="metric-value">${formatarMoeda(d.custoPorResultado)}</div></div>
      ${roasCard}
      ${seguidoresCard}
    </div>
    ${renderBars()}
  `;
}

async function carregar() {
  try {
    const res = await fetch("/.netlify/functions/get-meta-data");
    const json = await res.json();
    if (json.error) {
      document.getElementById("content").innerHTML = `<div class="error">Erro ao buscar dados: ${json.error}</div>`;
      return;
    }
    dados = json.dados;
    historico = json.historico_gasto || [];
    seguidores = json.seguidores || null;
    document.getElementById("updated").textContent =
      "Atualizado em " + new Date(json.atualizado_em).toLocaleString("pt-BR");
    renderTabs();
    renderContent();
  } catch (e) {
    document.getElementById("content").innerHTML = `<div class="error">Não foi possível carregar os dados.</div>`;
  }
}

carregar();
</script>
</body>
</html>
